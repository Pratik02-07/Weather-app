services:
  - type: web
    name: weather-ai-agent
    env: python
    rootDir: agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: MODEL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false